name: Bitlathe
options:
  bundleIdPrefix: com.bitlathe
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ARCHS: "$(ARCHS_STANDARD)"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  BitlathePackage:
    path: .
targets:
  Bitlathe:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: BitlathePackage
        product: BitlatheCore
      - package: BitlathePackage
        product: BitlatheUI
      - package: BitlathePackage
        product: BitlatheTools
      # quicklook: embed the preview extension in Contents/PlugIns
      - target: BitlatheQuickLook
        embed: true
    entitlements:
      path: App/Bitlathe.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Required by WebKit's renderer process inside the App Sandbox, even for local HTML.
        # Every remote load is blocked by the previews' content rule list; see Docs/Decisions.md.
        com.apple.security.network.client: true
        com.apple.security.print: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Bitlathe
        CFBundleDisplayName: Bitlathe
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Bitlathe"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.bitlathe.app
            CFBundleURLSchemes: [bitlathe]
        # url-scheme: Services menu entries (provider: App/Integrations/ServiceProvider.swift)
        NSServices:
          - NSMenuItem: {default: "Bitlathe: Format JSON"}
            NSMessage: formatJSON
            NSPortName: Bitlathe
            NSSendTypes: [NSStringPboardType]
            NSReturnTypes: [NSStringPboardType]
          - NSMenuItem: {default: "Bitlathe: Decode Base64"}
            NSMessage: decodeBase64
            NSPortName: Bitlathe
            NSSendTypes: [NSStringPboardType]
            NSReturnTypes: [NSStringPboardType]
          - NSMenuItem: {default: "Bitlathe: Smart Transform"}
            NSMessage: smartTransform
            NSPortName: Bitlathe
            NSSendTypes: [NSStringPboardType]
            NSReturnTypes: [NSStringPboardType]
        NSAppleEventsUsageDescription: Bitlathe uses Apple Events only for the Services menu.
        ITSAppUsesNonExemptEncryption: false
        # quicklook: file types the Quick Look extension previews (certs use the system public.x509-certificate)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bitlathe.jwt
            UTTypeDescription: JSON Web Token
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [jwt]
              public.mime-type: [application/jwt]
          - UTTypeIdentifier: com.bitlathe.json5
            UTTypeDescription: JSON5 / JSON with Comments
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [json5, jsonc]
          - UTTypeIdentifier: com.bitlathe.csr
            UTTypeDescription: Certificate Signing Request
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [csr, p10]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitlathe.app
        PRODUCT_NAME: Bitlathe
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
  # quicklook: Quick Look preview extension (sandboxed, read-only access to the previewed file)
  BitlatheQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
    dependencies:
      - package: BitlathePackage
        product: BitlatheCore
      - package: BitlathePackage
        product: BitlatheUI
      - package: BitlathePackage
        product: BitlatheTools
    entitlements:
      path: QuickLook/BitlatheQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleName: Bitlathe Quick Look
        CFBundleDisplayName: Bitlathe Quick Look
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes:
              - com.bitlathe.jwt
              - com.bitlathe.json5
              - com.bitlathe.csr
              - public.json
              - public.yaml
              - public.x509-certificate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitlathe.app.quicklook
        PRODUCT_NAME: BitlatheQuickLook
        SKIP_INSTALL: YES
