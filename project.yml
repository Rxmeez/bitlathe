name: Bitlathe
options:
  bundleIdPrefix: com.bitlathe
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ARCHS: "$(ARCHS_STANDARD)"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    DEAD_CODE_STRIPPING: YES
  # flavour: Debug builds "Bitlathe Dev" (own bundle id, data, URL scheme, icon) so it can run beside the
  # installed Release "Bitlathe". AppFlavour.isDev reads the bundle id suffix at runtime.
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      BL_APP_NAME: "Bitlathe Dev"
      BL_BUNDLE_SUFFIX: ".dev"
      BL_URL_SCHEME: bitlathe-dev
      BL_APP_ICON: AppIcon-Dev
    Release:
      ONLY_ACTIVE_ARCH: NO
      BL_APP_NAME: Bitlathe
      BL_BUNDLE_SUFFIX: ""
      BL_URL_SCHEME: bitlathe
      BL_APP_ICON: AppIcon
packages:
  BitlathePackage:
    path: .
  # release: Sparkle is the only extra dependency; linked into the Direct target only.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
# release: both app targets share this template (same sources, same entitlements except where overridden below).
targetTemplates:
  BitlatheApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info*.plist"
          - "*.entitlements"
    dependencies:
      - package: BitlathePackage
        product: BitlatheCore
      - package: BitlathePackage
        product: BitlatheUI
      - package: BitlathePackage
        product: BitlatheTools
      # quicklook: embed the preview extension in Contents/PlugIns
      - target: BitlatheQuickLook
        embed: true
    info:
      properties:
        CFBundleName: "$(BL_APP_NAME)"
        CFBundleDisplayName: "$(BL_APP_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Bitlathe"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes: ["$(BL_URL_SCHEME)"]
        # url-scheme: Services menu entries (provider: App/Integrations/ServiceProvider.swift)
        NSServices:
          - NSMenuItem: {default: "$(BL_APP_NAME): Format JSON"}
            NSMessage: formatJSON
            NSPortName: "$(BL_APP_NAME)"
            NSSendTypes: [NSStringPboardType]
            NSReturnTypes: [NSStringPboardType]
          - NSMenuItem: {default: "$(BL_APP_NAME): Decode Base64"}
            NSMessage: decodeBase64
            NSPortName: "$(BL_APP_NAME)"
            NSSendTypes: [NSStringPboardType]
            NSReturnTypes: [NSStringPboardType]
          - NSMenuItem: {default: "$(BL_APP_NAME): Smart Transform"}
            NSMessage: smartTransform
            NSPortName: "$(BL_APP_NAME)"
            NSSendTypes: [NSStringPboardType]
            NSReturnTypes: [NSStringPboardType]
        NSAppleEventsUsageDescription: "$(BL_APP_NAME) uses Apple Events only for the Services menu."
        ITSAppUsesNonExemptEncryption: false
        # quicklook: file types the Quick Look extension previews (certs use the system public.x509-certificate)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bitlathe.jwt
            UTTypeDescription: JSON Web Token
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [jwt]
              public.mime-type: [application/jwt]
          - UTTypeIdentifier: com.bitlathe.json5
            UTTypeDescription: JSON5 / JSON with Comments
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [json5, jsonc]
          - UTTypeIdentifier: com.bitlathe.csr
            UTTypeDescription: Certificate Signing Request
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [csr, p10]
    settings:
      base:
        PRODUCT_NAME: "$(BL_APP_NAME)"
        PRODUCT_MODULE_NAME: Bitlathe
        ASSETCATALOG_COMPILER_APPICON_NAME: "$(BL_APP_ICON)"
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
targets:
  Bitlathe:
    templates: [BitlatheApp]
    entitlements:
      path: App/Bitlathe.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Required by WebKit's renderer process inside the App Sandbox, even for local HTML.
        # Every remote load is blocked by the previews' content rule list; see Docs/Decisions.md.
        com.apple.security.network.client: true
        com.apple.security.print: true
        # release: Sparkle's sandboxed installer/launcher XPC services (Direct build only).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spks"
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spki"
    info:
      path: App/Info.plist
      properties:
        # release: Sparkle. SU_FEED_URL / SU_PUBLIC_ED_KEY are build settings (see Docs/Release.md).
        SUFeedURL: "$(SU_FEED_URL)"
        SUPublicEDKey: "$(SU_PUBLIC_ED_KEY)"
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: false
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.bitlathe.app$(BL_BUNDLE_SUFFIX)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"
        SU_FEED_URL: https://github.com/Rxmeez/bitlathe/releases/latest/download/appcast.xml
        SU_PUBLIC_ED_KEY: "z/ZnlUkO+ZB90AzE0iTHzRDayptATr3tse4fhwmKqEw="
        # release: the embed-cli phase runs `swift build`, which a user-script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Embed bl CLI (Helpers/bl)
        script: |
          "$SRCROOT/scripts/embed-cli.sh"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: []
      gatherCoverageData: false
  # release: Mac App Store build. No Sparkle, no DIRECT_DISTRIBUTION, sandbox-only entitlements.
  Bitlathe-AppStore:
    templates: [BitlatheApp]
    entitlements:
      path: App/Bitlathe-AppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.print: true
    info:
      path: App/Info-AppStore.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.bitlathe.app$(BL_BUNDLE_SUFFIX)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
    scheme:
      testTargets: []
      gatherCoverageData: false
  # quicklook: Quick Look preview extension (sandboxed, read-only access to the previewed file)
  BitlatheQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
    dependencies:
      - package: BitlathePackage
        product: BitlatheCore
      - package: BitlathePackage
        product: BitlatheUI
      - package: BitlathePackage
        product: BitlatheTools
    entitlements:
      path: QuickLook/BitlatheQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleName: "$(BL_APP_NAME) Quick Look"
        CFBundleDisplayName: "$(BL_APP_NAME) Quick Look"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes:
              - com.bitlathe.jwt
              - com.bitlathe.json5
              - com.bitlathe.csr
              - public.json
              - public.yaml
              - public.x509-certificate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.bitlathe.app$(BL_BUNDLE_SUFFIX).quicklook"
        PRODUCT_NAME: BitlatheQuickLook
        SKIP_INSTALL: YES
